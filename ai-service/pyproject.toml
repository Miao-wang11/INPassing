[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "shunshou-ai-service"
version = "0.1.0"
description = "Campus delegation and walking-route matching Agent service"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite==3.1.2",
  "langchain-openai>=1.0,<2",
  "httpx>=0.28,<1",
  "mcp>=1.28,<2",
  "jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
