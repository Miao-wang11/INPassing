[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "shunshou-ai-service"
version = "0.1.0"
description = "Phase 1 FastAPI + LangGraph scaffold for ShunShou; no business write tools"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite==3.1.2",
  "langchain-openai>=1.0,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
