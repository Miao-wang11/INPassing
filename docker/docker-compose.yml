services:
  mysql:
    image: mysql:8.0
    container_name: rr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env}
      MYSQL_DATABASE: runningerrands
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/runningerrands.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # On fresh empty volumes, base schema is followed ONLY by agent tables.
      # Existing volumes require a backed-up/manual one-time migration (see docs).
      # Current runningerrands.sql ALREADY includes campus, storefront, disputes,
      # and operations index DDL. Re-running the 20261020 once-only ALTER
      # migrations on a FRESH volume aborts MySQL init before agent tables.
      - ../backend/migrations/20261021_agent_operation.sql:/docker-entrypoint-initdb.d/06-agent-operation.sql:ro
      - ../backend/migrations/20261021_agent_walk_network.sql:/docker-entrypoint-initdb.d/07-agent-walking.sql:ro
    healthcheck:
      # Docker's temporary initialization MySQL may answer unix-socket ping
      # before /docker-entrypoint-initdb.d has finished all stage migrations.
      # Require TCP + the last migration sentinel tables before backend starts.
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=TCP
          -h 127.0.0.1 -uroot -D runningerrands -Nse
          "SELECT COUNT(*) FROM information_schema.tables
          WHERE table_schema=DATABASE()
          AND table_name IN ('agent_operation','agent_walk_edge')"
          | grep -qx '2'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - rr-net

  redis:
    image: redis:7-alpine
    container_name: rr-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rr-net

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: rr-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in docker/.env}
      RUNNING_ERRANDS_JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?Set JWT_ADMIN_SECRET in docker/.env}
      RUNNING_ERRANDS_JWT_USER_SECRET: ${JWT_USER_SECRET:?Set JWT_USER_SECRET in docker/.env}
      RUNNING_ERRANDS_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      RUNNING_ERRANDS_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in docker/.env}
      SHUNSHOU_DEMO_SEED: ${SHUNSHOU_DEMO_SEED:-false}
      SHUNSHOU_DEMO_PASSWORD: ${SHUNSHOU_DEMO_PASSWORD:-}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      TENCENT_MAP_API_KEY: ${TENCENT_MAP_API_KEY:-}
      SHUNSHOU_AI_INTERNAL_TOKEN: ${SHUNSHOU_AI_INTERNAL_TOKEN:?Generate a private random 32-byte+ shared key in docker/.env}
      SHUNSHOU_AGENT_PYTHON_URL: http://ai-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - rr-net

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    # Internal network only: NEVER publish port 8000 on the host.
    environment:
      SHUNSHOU_AI_INTERNAL_TOKEN: ${SHUNSHOU_AI_INTERNAL_TOKEN:?Generate a private random 32-byte+ shared key}
      SHUNSHOU_AI_ENVIRONMENT: ${SHUNSHOU_AI_ENVIRONMENT:-development}
      SHUNSHOU_AI_MODEL_PROVIDER: ${SHUNSHOU_AI_MODEL_PROVIDER:-mock}
      SHUNSHOU_AI_MODEL_NAME: ${SHUNSHOU_AI_MODEL_NAME:-gpt-4.1-mini}
      SHUNSHOU_AI_MODEL_BASE_URL: ${SHUNSHOU_AI_MODEL_BASE_URL:-}
      SHUNSHOU_AI_MODEL_API_KEY: ${SHUNSHOU_AI_MODEL_API_KEY:-}
      SHUNSHOU_AI_JAVA_BASE_URL: http://backend:8080/api
      SHUNSHOU_AI_CHECKPOINT_PATH: /app/data/checkpoints.sqlite3
    volumes:
      - agent_checkpoint:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - rr-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: rr-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - rr-net

volumes:
  mysql_data:
  redis_data:
  agent_checkpoint:

networks:
  rr-net:
    driver: bridge
