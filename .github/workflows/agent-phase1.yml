name: Agent Phases 1-3 CI
on:
  push:
    branches: [feat/agent-phase1-skeleton, feat/agent-phase2-readonly-tools, feat/agent-phase3-delegation]
    paths:
      - 'ai-service/**'
      - '.github/workflows/agent-phase1.yml'
      - 'backend/**'
  pull_request:
    paths:
      - 'ai-service/**'
      - '.github/workflows/agent-phase1.yml'
      - 'backend/**'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test agent and real TCP HTTP
        env:
          SHUNSHOU_AI_INTERNAL_TOKEN: ci-not-used-directly-0123456789abcdef-0123456789
        run: |
          python -m compileall -q app tests
          pytest -q
  java-regression:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: agent_ci_root
          MYSQL_DATABASE: agent_phase3_it
          MYSQL_USER: agent_test
          MYSQL_PASSWORD: agent_test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pagent_ci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Original Java reactor build and tests
        run: mvn -B -f backend/pom.xml clean verify
      - name: Actual MySQL concurrency and idempotency integration test
        env:
          SHUNSHOU_AGENT_IT_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/agent_phase3_it?useSSL=false&allowPublicKeyRetrieval=true
        run: mvn -B -f backend/pom.xml -pl :runningerrands-server -am -Dtest=AgentMysqlIdempotencyIT -Dsurefire.failIfNoSpecifiedTests=false test
