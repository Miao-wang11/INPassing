name: Agent Phases 1-6 CI
on:
  push:
    branches: [feat/agent-phase1-skeleton, feat/agent-phase2-readonly-tools, feat/agent-phase3-delegation, feat/agent-phase4-route-matching, feat/agent-phase5-uniapp-compose, feat/agent-phase6-evaluation-delivery]
    paths:
      - 'ai-service/**'
      - '.github/workflows/agent-phase1.yml'
      - 'backend/**'
      - 'mobile/**'
      - 'docker/**'
  pull_request:
    paths:
      - 'docker/**'
      - 'docs/agent/**'
      - 'mobile/**'
      - 'ai-service/**'
      - '.github/workflows/agent-phase1.yml'
      - 'backend/**'
      - 'mobile/**'
      - 'docker/**'
      - 'docs/agent/**'
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test agent and real TCP HTTP
        env:
          SHUNSHOU_AI_INTERNAL_TOKEN: ci-not-used-directly-0123456789abcdef-0123456789
        run: |
          python -m compileall -q app tests
          pytest -q
          python -m compileall -q app/evaluation.py
  java-regression:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: agent_ci_root
          MYSQL_DATABASE: agent_phase3_it
          MYSQL_USER: agent_test
          MYSQL_PASSWORD: agent_test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pagent_ci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Original Java reactor build and tests
        run: mvn -B -f backend/pom.xml clean verify
      - name: Actual MySQL concurrency and idempotency integration test
        env:
          SHUNSHOU_AGENT_IT_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/agent_phase3_it?useSSL=false&allowPublicKeyRetrieval=true
        run: mvn -B -f backend/pom.xml -pl :runningerrands-server -am -Dtest=AgentMysqlIdempotencyIT,AgentWalkNetworkIT -Dsurefire.failIfNoSpecifiedTests=false test

  mobile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      # Official mobile project has no uni-app npm build target.
      # Test actual ESM API contract and compile new+edited Vue SFCs instead.
      - name: Run student Agent contract tests
        run: node --test mobile/tests/agent-contract.test.mjs
      - name: Install Vue SFC compiler from existing admin dependencies
        run: npm ci --prefix admin
      - name: Compile changed student Vue SFCs and inspect route registration
        run: node mobile/tests/validate-agent-ui.mjs

  compose-smoke:
    runs-on: ubuntu-latest
    env:
      SHUNSHOU_DEMO_SEED: 'true'
      SHUNSHOU_AI_INTERNAL_TOKEN: ci-stage5-only-generated-not-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose expanded service dependencies
        run: docker compose --env-file docker/.env.example -f docker/docker-compose.yml config --quiet
      - name: Build genuine Python Agent image
        run: docker compose --env-file docker/.env.example -f docker/docker-compose.yml build ai-service
      - name: Start isolated MySQL, Redis, and internal Python Agent
        run: |
          docker compose --env-file docker/.env.example -f docker/docker-compose.yml up -d mysql redis ai-service
          for attempt in $(seq 1 25); do
            if docker compose --env-file docker/.env.example -f docker/docker-compose.yml exec -T ai-service \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=2).read()"; then
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file docker/.env.example -f docker/docker-compose.yml logs --tail=80 mysql ai-service
          exit 1
      - name: Build existing Spring Boot and Nginx images
        run: docker compose --env-file docker/.env.example -f docker/docker-compose.yml build backend nginx
      - name: Start complete stack and check internal authorization over real TCP
        run: |
          docker compose --env-file docker/.env.example -f docker/docker-compose.yml up -d backend nginx
          for attempt in $(seq 1 30); do
            if docker compose --env-file docker/.env.example -f docker/docker-compose.yml exec -T ai-service \
              python -c "import json,urllib.request; x=json.load(urllib.request.urlopen('http://backend:8080/api/actuator/health', timeout=3)); assert x.get('status')=='UP', x"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose --env-file docker/.env.example -f docker/docker-compose.yml logs --tail=100 backend mysql
              exit 1
            fi
            sleep 4
          done
          # Check both authenticated boundary paths; never use model-derived identity.
          docker compose --env-file docker/.env.example -f docker/docker-compose.yml exec -T ai-service python - <<'PY'
          import urllib.error
          import urllib.request
          cases = [
              ('http://backend:8080/api/internal/agent/v1/matching/candidates', 'GET'),
              ('http://backend:8080/api/agent/route-match', 'POST'),
          ]
          for url, method in cases:
              body = b'{}' if method == 'POST' else None
              request = urllib.request.Request(url, data=body, method=method)
              if method == 'POST':
                  request.add_header('Content-Type', 'application/json')
              try:
                  urllib.request.urlopen(request, timeout=3)
                  raise AssertionError('unsigned request unexpectedly accepted: ' + url)
              except urllib.error.HTTPError as error:
                  assert error.code == 401, (url, error.code)
          print('Unsigned internal and missing-JWT user HTTP requests denied')
          PY
      - name: Genuine simulated-wallet Agent transaction on fresh demo database
        run: |
          docker compose --env-file docker/.env.example -f docker/docker-compose.yml \
            exec -T -e SHUNSHOU_E2E_DISPOSABLE=1 ai-service \
            python - < ai-service/tests/integration/compose_simulated_wallet.py
      - name: Collect disposable integration backend errors on failure
        if: failure()
        run: |
          docker compose --env-file docker/.env.example -f docker/docker-compose.yml logs --tail=180 backend mysql ai-service
      - name: Teardown isolated CI volumes
        if: always()
        run: docker compose --env-file docker/.env.example -f docker/docker-compose.yml down -v --remove-orphans
