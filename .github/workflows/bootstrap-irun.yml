name: Import pinned iRun baseline
on:
  push:
    branches:
      - integration/irun-bootstrap
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/irun-bootstrap
      - name: Import sources
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/pom.xml ]; then
            echo "Baseline exists. Nothing to import."
            exit 0
          fi
          UPSTREAM_COMMIT=14d19341a5ae6e5a3c751328fcc273395da5bd21
          git clone https://github.com/Ikeu-1030/iRun.git /tmp/shunshou-upstream
          git -C /tmp/shunshou-upstream checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C /tmp/shunshou-upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          cp -a /tmp/shunshou-upstream/backend ./backend
          cp -a /tmp/shunshou-upstream/admin ./admin
          cp -a /tmp/shunshou-upstream/mobile ./mobile
          cp -a /tmp/shunshou-upstream/docker ./docker
          cp /tmp/shunshou-upstream/LICENSE ./LICENSE
          cp /tmp/shunshou-upstream/README.md ./docs/UPSTREAM_iRun_README.md
          cp /tmp/shunshou-upstream/DESIGN.md ./docs/UPSTREAM_iRun_DESIGN.md
          rm -rf backend/.claude
          echo "$UPSTREAM_COMMIT" > docs/UPSTREAM_IRUN_COMMIT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend admin mobile docker LICENSE docs/UPSTREAM_iRun_README.md docs/UPSTREAM_iRun_DESIGN.md docs/UPSTREAM_IRUN_COMMIT.txt
          git commit -m "chore: import upstream iRun baseline"
          git push origin HEAD:integration/irun-bootstrap
