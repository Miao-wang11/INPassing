name: Import pinned iRun baseline

on:
  push:
    branches:
      - integration/irun-bootstrap
    paths:
      - .github/workflows/bootstrap-irun.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: import upstream') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout INPassing
        uses: actions/checkout@v4
        with:
          ref: integration/irun-bootstrap
          fetch-depth: 2

      - name: Import pinned upstream source only
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/pom.xml ]; then
            echo "Already imported; refusing to overwrite project changes."
            exit 0
          fi
          UPSTREAM_COMMIT=14d19341a5ae6e5a3c751328fcc273395da5bd21
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          git clone --filter=blob:none https://github.com/Ikeu-1030/iRun.git "$tempdir/upstream"
          git -C "$tempdir/upstream" checkout --detach "$UPSTREAM_COMMIT"
          test "$(git -C "$tempdir/upstream" rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          cp -a "$tempdir/upstream/backend" ./backend
          cp -a "$tempdir/upstream/admin" ./admin
          cp -a "$tempdir/upstream/mobile" ./mobile
          cp -a "$tempdir/upstream/docker" ./docker
          cp "$tempdir/upstream/LICENSE" ./LICENSE
          cp "$tempdir/upstream/README.md" ./docs/UPSTREAM_iRun_README.md
          cp "$tempdir/upstream/README_EN.md" ./docs/UPSTREAM_iRun_README_EN.md
          cp "$tempdir/upstream/DESIGN.md" ./docs/UPSTREAM_iRun_DESIGN.md
          # Exclude tool-generated and private developer workspace instructions
          rm -rf backend/.claude
          find . -name '.DS_Store' -type f -delete
          echo "$UPSTREAM_COMMIT" > docs/UPSTREAM_IRUN_COMMIT.txt
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend admin mobile docker LICENSE docs/UPSTREAM_iRun_README.md docs/UPSTREAM_iRun_README_EN.md docs/UPSTREAM_iRun_DESIGN.md docs/UPSTREAM_IRUN_COMMIT.txt
          git commit -m "chore: import upstream iRun baseline at $UPSTREAM_COMMIT"
          git push origin HEAD:integration/irun-bootstrap

      - name: Source import summary
        shell: bash
        run: |
          echo "Baseline import completed into the integration branch."
          echo "No runtime smoke tests or end-to-end tests were run in this workflow."
